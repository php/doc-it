name: Build Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    # A list in runs-on means "one runner with all these labels", which never
    # matches: a matrix runs the same job once per operating system instead.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF endings in doc-en and doc-base too (doc-it has .gitattributes).
      - name: Disable CRLF conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # Same PHP on both systems, so both builds give the same result.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: 'it'

      - name: Clone doc-en and doc-base
        run: |
          git clone --depth=1 https://github.com/php/doc-base.git doc-base
          git clone https://github.com/php/doc-en.git en
      - name: configure.php
        run: php doc-base/configure.php --enable-xml-details --disable-libxml-check --redirect-stderr-to-stdout --with-lang=it
      - name: Checks
        run: |
          php doc-base/scripts/translation/qaxml-attributes.php --urgent
          php doc-base/scripts/translation/qaxml-entities.php --urgent